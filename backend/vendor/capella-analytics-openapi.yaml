          description: The ID of the cluster.
        bucketId:
          type: string
          example: dGVzdA
          description: The ID of the bucket. This is the Base64 encoding of the bucket name.
        weeklySchedule:
          $ref: '#/components/schemas/WeeklySchedule'
    GetScopeResponse:
      type: object
