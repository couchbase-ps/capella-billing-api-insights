        items:
          type: string
          enum:
            - availability
            - billing
            - maintenance
            - performance
            - security
            - alert
    To:
      name: to
      description: End datetime in the last 24 hours, RFC3339 format. Defaults to Now.
      in: query
      schema:
        type: string
        format: date-time
        example: '2024-04-25T12:53:59.000Z'
    UserId:
      name: userId
      description: The GUID4 ID of the database credential.
      in: path
      required: true
      schema:
        type: string
        format: uuid
        example: ffffffff-aaaa-1414-eeee-000000000000
    UserIds:
      name: userIds
      description: Filter by user UUID. Default is to return events corresponding to all users.
      example:
        - ffffffff-aaaa-1414-eeee-000000000000
      in: query
      schema:
        type: array
        items:
          type: string
          format: uuid
          example: ffffffff-aaaa-1414-eeee-000000000000
    UsersSortBy:
      in: query
      name: sortBy
      description: 'Sets the order of how you would like to sort the results and the key you would like to order by. Valid fields to sort the results are: **id**, **name**, **email**, **status**, **inactive**.'
      example:
        - name
      required: false
      schema:
        type: array
        items:
          type: string
    WorkflowId:
      name: workflowId
      description: |
        The unique identifier of the AI workflow.
      in: path
      required: true
      schema:
        type: string
        format: uuid
        example: ffffffff-aaaa-1414-eeee-000000000000
    WorkflowRunId:
      name: runId
      description: |
        The unique identifier of the AI workflow run.
      in: path
      required: true
      schema:
        type: string
        format: uuid
        example: ffffffff-aaaa-1414-eeee-000000000000
    appEndpointId:
      name: appEndpointName
      description: The name of the App Endpoint.
      in: path
      required: true
      schema:
        type: string
        example: endpoint1
    appEndpointKeyspace:
      name: appEndpointKeyspace
      description: |
        A specific collection denoted by the App Endpoint name, the scope name and collection name separated by a period, for example "endpoint1.scope1.collection1".
        If only an App Endpoint name is provided this will be interpreted as "endpoint1._default._default". If only an App Endpoint name and collection name are
        provided these will interpreted as a named collection within the default scope, for example "endpoint1.collection1" will be interpreted as "endpoint1._default.collection1".
      in: path
      required: true
      schema:
        type: string
        example: endpoint1.scope1.collection1
  schemas:
    APIKeyAllowedCIDRs:
      type: array
      items:
        type: string
      example:
        - 0.0.0.0/0
      description: |
        List of inbound CIDRs for the API key.
        The system making a request must come from one of the allowed CIDRs.
      default:
        - 0.0.0.0/0
    APIKeyDescription:
      type: string
      description: |
        Description for the API key.
      example: API key to manage production Capella Cluster.
      default: ''
    APIKeyExpiry:
      type: number
      format: float
      default: 180
      description: |
        Expiry of the API key in number of days. Must be at least 0.01 days.
        If set to -1, the token will not expire.
    APIKeyId:
      type: string
      example: IS9DrRsw4KWFS72Zhbj4xmhllHvPcdCL
      description: |
        The id is a unique identifier for an apiKey.
    APIKeyName:
      type: string
      description: |
        Name of the API key.
      example: Production
    APIKeyOrganizationRoles:
      type: string
      enum:
        - organizationOwner
        - organizationMember
        - projectCreator
      example: organizationMember
      description: |
        Organization roles assigned to the API key.

        To learn more, see [Organization Roles](https://docs.couchbase.com/cloud/organizations/organization-user-roles.html).
    APIKeyResources:
      type: array
      description: |
        Resources are the resource level permissions associated with the API key.

        To learn more about Organization Roles, see [Organization Roles](https://docs.couchbase.com/cloud/organizations/organization-user-roles.html).
      items:
        $ref: '#/components/schemas/APIKeyResourcesItems'
      default: []
    APIKeyResourcesItems:
      type: object
      required:
        - id
        - roles
      properties:
        type:
          type: string
          default: project
          description: |
            Type of the resource.
        id:
          type: string
          format: uuid
          example: ffffffff-aaaa-1414-eeee-000000000000
          description: |
            ID of the project.
        roles:
          type: array
          items:
            type: string
            enum:
              - projectOwner
              - projectManager
              - projectViewer
              - projectDataReaderWriter
              - projectDataReader
          example:
            - projectDataReaderWriter
            - projectManager
          description: |
            Project Roles associated with the API key.

            To learn more about Project Roles, see [Project Roles](https://docs.couchbase.com/cloud/projects/project-roles.html).
    AWS:
      type: object
      properties:
        providerId:
          description: The ID of the VPC peer on AWS.
          type: string
          example: pcx-000000fff000fff
        AWSConfig:
          $ref: '#/components/schemas/AWSConfigData'
    AWSConfig:
      type: object
      required:
        - arn
      properties:
        arn:
          type: string
          description: The Amazon Resource Name (ARN) that uniquely identifies the AWS KMS key.
          example: arn:aws:kms:us-west-2:123456789012:key/abcd1234-a123-456a-a12b-a123b4cd56ef
    AWSConfigData:
      type: object
      required:
        - accountId
        - vpcId
        - region
        - cidr
      description: AWS config data required to establish a VPC peering relationship. Refer to the docs for other limitations to AWS VPC Peering - [ref](https://docs.aws.amazon.com/vpc/latest/peering/vpc-peering-basics.html#vpc-peering-limitations).
      properties:
        accountId:
          type: string
          description: The numeric AWS Account ID or Owner ID.
          example: '00000011123'
        vpcId:
          type: string
          description: The alphanumeric VPC ID which starts with \"vpc-\". This is also known as the networkId.
          example: vpc-141f0fffff141aa00
        region:
          type: string
          description: The AWS region where your VPC is deployed.
          example: us-east-1
        cidr:
          type: string
          description: The AWS VPC CIDR block of network in which your application runs. This cannot overlap with your Capella CIDR Block.
          example: 10.0.0.0/16
    AZURE:
      type: object
      properties:
        providerId:
          description: The ID of the VNet peer on Azure.
          type: string
          example: ffffffff-aaaa-1414-eeee-000000000000
        AzureConfig:
          $ref: '#/components/schemas/AzureConfigData'
    AccessFunction:
      type: string
      description: All mutations in this collection are processed by this Javascript function
      example: function(doc,oldDoc,meta){channel('collection name');}
    Actions:
      type: array
      description: Actions that can be performed on the language model.
      items:
        type: string
        enum:
          - deploy
          - delete
          - pause
          - resume
      example:
        - delete
    AllowedCidr:
      type: object
      required:
        - id
        - cidr
        - status
        - type
        - audit
      properties:
        id:
          type: string
          description: The ID of the allowed CIDR.
          example: ffffffff-aaaa-1414-eeee-000000000000
        cidr:
          type: string
          description: |
            The trusted CIDR to allow the database connections from. The example
            represents a single IP address (i.e. a subnet mask of 32).
          example: 1.23.45.67/32
        comment:
          type: string
          description: A short description of the allowed CIDR.
          example: Allows access from my local developer machine
        expiresAt:
          type: string
          description: |
            An RFC3339 timestamp determining when the allowed CIDR will expire.
            If this field is omitted then the allowed CIDR is permanent and will never automatically expire.
          format: date-time
          example: '2023-05-14T21:49:58.465Z'
        status:
          type: string
          description: The current status of the allowed CIDR.
          enum:
            - active
            - expired
          example: active
        type:
          type: string
          enum:
            - temporary
            - permanent
          default: permanent
          description: Whether the allowed CIDR is permanent or has an expiry.
          example: temporary
        audit:
          $ref: '#/components/schemas/CouchbaseAuditData'
    AppServiceAdminUser:
      type: object
      properties:
        id:
          type: string
          description: The unique identifier for the user.
          example: ffffffff-aaaa-1414-eeee-000000000000
        tenantId:
          type: string
          readOnly: true
          description: The GUID4 ID of the tenant.
          example: ffffffff-aaaa-1414-eeee-000000000000
        projectId:
          type: string
          description: The GUID4 ID of the project.
          example: ffffffff-aaaa-1414-eeee-000000000000
        clusterId:
          type: string
          description: The GUID4 ID of the cluster.
          example: ffffffff-aaaa-1414-eeee-000000000000
        name:
          type: string
          description: The name of the user.
          example: user1
        endpoints:
          type: array
          description: The list of App Endpoints that the user has access to.
          example:
            - appEndpoint1
            - appEndpoint2
          items:
            type: string
        accessAllEndpoints:
          description: Give user access to all App Endpoints.
          type: boolean
          example: false
        audit:
          $ref: '#/components/schemas/CouchbaseAuditData'
    AppServiceAllowedCidr:
      type: object
      required:
        - id
        - cidr
        - status
        - type
        - audit
      properties:
        id:
          type: string
          description: The ID of the allowed CIDR.
          example: ffffffff-aaaa-1414-eeee-000000000000
        cidr:
          type: string
          description: |
            The trusted CIDR to allow network connections from. The example
            represents a single IP address (i.e. a subnet mask of 32).
          example: 1.23.45.67/32
        comment:
          type: string
          description: A short description of the allowed CIDR.
          example: Allows access from my local developer machine
        expiresAt:
          type: string
          description: |
            An RFC3339 timestamp determining when the allowed CIDR will expire.
            If this field is omitted then the allowed CIDR is permanent and will never automatically expire.
          format: date-time
          example: '2023-05-14T21:49:58.465Z'
        status:
          type: string
          description: The current status of the allowed CIDR.
          enum:
            - active
            - expired
          example: active
        type:
          type: string
          enum:
            - temporary
            - permanent
          default: permanent
          description: Whether the allowed CIDR is permanent or has an expiry.
          example: temporary
        audit:
          $ref: '#/components/schemas/CouchbaseAuditData'
    AppServiceCompute:
      type: object
      description: |
        The CPU and RAM configuration of the App Service. The supported combinations are:
        | CPU (cores)| RAM  (GB)   |
        | --------   |   -------   |
        | 2          | 4           |
        | 4          | 8           |
        | 8          | 16          |
        | 16         | 32          |
        | 36         | 72          |
      required:
        - cpu
        - ram
      properties:
        cpu:
          type: integer
          description: CPU units (cores).
          example: 2
        ram:
          type: integer
          description: RAM units (GB).
          example: 4
    AppServiceStates:
      type: string
