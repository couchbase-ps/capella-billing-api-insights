        - vectorizationConfig
      properties:
        source:
          $ref: '#/components/schemas/IntegrationConfig'
        targetCouchbaseKeyspace:
          $ref: '#/components/schemas/CouchbaseKeyspace'
        structuredDataProcessingConfig:
          description: Configuration for structured data processing.
          type: object
          required:
            - jsonType
          properties:
            keyFieldName:
              type: string
              description: |
                The name of the field that will be used as the key for the Capella document. Random UUID will be generated if not provided.
              example: document_id
            jsonType:
              type: string
              description: |
                The type of JSON that has to be processed by the structured data processing workflow.
              enum:
                - json
                - jsonlist
                - jsonlines
              example: jsonlines
        vectorizationConfig:
          $ref: '#/components/schemas/VectorizationConfig'
    GetSupportedExternalEmbeddingModelsResponse:
      type: object
      required:
        - data
        - cursor
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ExternalEmbeddingModel'
        cursor:
          $ref: '#/components/schemas/Cursor'
    GetUnstructuredWorkflowResponse:
      type: object
      required:
        - source
        - targetCouchbaseKeyspace
        - unstructuredDataProcessingConfig
        - vectorizationConfig
      properties:
        source:
          $ref: '#/components/schemas/IntegrationConfig'
        targetCouchbaseKeyspace:
          $ref: '#/components/schemas/CouchbaseKeyspace'
        unstructuredDataProcessingConfig:
          description: Configuration for unstructured data processing.
          type: object
          required:
            - chunkingStrategy
          properties:
            pageNumbers:
              type: array
              description: |
                The page range of the file which has to be processed.
                If not provided, all pages will be processed.
                Should be an array of size 2, with the first element being the start page and the second element being the end page.
              example:
                - 3
                - 16
              items:
                type: integer
            exclusions:
              type: array
              description: |
                The sections of the file which have to be excluded from the unstructured data processing workflow.
                Should be an array of strings, each representing a section of the file to be excluded.
                The possible values are:
                  - Header
                  - Footer
                  - Table
                  
                If not provided, all sections will be processed.
              example:
                - header
                - footer
              items:
                type: string
                enum:
                  - header
                  - footer
                  - table
            enableOCR:
              type: boolean
              description: |
                Whether to enable OCR scanning for the file.
                If not provided, OCR will be disabled.
              example: true
              default: false
            chunkingStrategy:
              type: object
              description: |
                The strategy to use for chunking the file.
              properties:
                strategyType:
                  type: string
                  enum:
                    - RECURSIVE_SPLITTER
                    - SEMANTIC_SPLITTER
                    - PARAGRAPH_SPLITTER
                    - SENTENCE_SPLITTER
                    - FIXED_TOKEN_SPLITTER
                chunkSize:
                  type: integer
                  description: |
                    The size of the chunks to be created.
                  example: 1000
                chunkOverlap:
                  type: integer
                  description: |
                    The overlap between the chunks.
                  example: 100
            objectMetadataExtractionConfig:
              type: object
              description: |
                Configuration for extracting metadata from S3 objects.
                This allows you to copy system-defined and user-defined metadata from S3 objects
                into the processed documents.
              properties:
                systemMetadataKeys:
                  type: array
                  description: |
                    List of S3 system metadata keys to extract from objects.
                    If empty array, all system metadata is extracted.
                    If null/omitted, no system metadata is extracted.
                  example:
                    - ContentType
                    - LastModified
                  items:
                    type: string
                userMetadataKeys:
                  type: array
                  description: |
                    List of user-defined metadata keys to extract from S3 objects.
                    If empty array, all user metadata is extracted.
                    If null/omitted, no user metadata is extracted.
                  example:
                    - author
                    - department
                    - version
                  items:
                    type: string
        vectorizationConfig:
          $ref: '#/components/schemas/VectorizationConfig'
    GetUserResponse:
      type: object
      required:
        - id
        - name
        - email
        - status
        - inactive
        - organizationId
        - organizationRoles
        - audit
      properties:
        id:
          type: string
          example: ffffffff-aaaa-1414-eeee-000000000000
          description: The UUID of the user created.
        name:
          type: string
          example: alex
          description: The name of the user.
          maxLength: 128
        email:
          $ref: '#/components/schemas/Email'
        status:
          type: string
          description: |
            Depicts user status whether they are verified or not.
            - verified: It reflects a verified state for an email address where the user has proven that they have access to the email account.
            - not-verified: It reflects an unverified or pending verification state.
            - pending-primary: It reflects an unverified primary email address
          enum:
            - verified
            - not-verified
            - pending-primary
          example: not-verified
        inactive:
          type: boolean
          description: Depicts whether the user has accepted the invite for the organization.
          example: false
        organizationId:
          type: string
          example: ffffffff-aaaa-1414-eeee-000000000000
          description: A GUID4 identifier of the tenant.
        organizationRoles:
          type: array
          items:
            $ref: '#/components/schemas/OrganizationRoles'
        lastLogin:
          type: string
          format: date-time
          example: '2023-07-17T07:05:39.116124897Z'
          description: Time(UTC) at which user last logged in.
        region:
          type: string
          example: North America
          description: Region of the user.
        timeZone:
          type: string
          example: (UTC -9:00) Alaska Standard Time
          description: Time zone of the user.
        enableNotifications:
          type: boolean
          example: true
          description: After enabling email notifications for your account, you will start receiving email notification alerts from all databases in projects you are a part of.
        expiresAt:
          type: string
          format: date-time
          example: '2023-07-17T07:05:39.116124897Z'
          description: Time at which user expires.
        resources:
          type: array
          items:
            $ref: '#/components/schemas/Resource'
        audit:
          $ref: '#/components/schemas/CouchbaseAuditData'
