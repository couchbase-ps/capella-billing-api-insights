          description: |
            If set, the value(s) of the given OpenID Connect authentication token claim will be added to the user's roles.
            The value of this claim in the OIDC token must be either a string or an array of strings, any other type will result in an error.
        scope:
          type: array
          items:
            type: string
          example:
            - openid
            - profile
            - email
          description: The scope sent for the OpenID Connect request.
          default:
            - openid
            - email
      example:
