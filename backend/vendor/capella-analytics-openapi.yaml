    GetLogStreamingResponse:
      type: object
      properties:
        outputType:
          type: string
          enum:
            - datadog
            - generic_http
            - sumologic
            - loki
            - elastic
            - splunk
            - dynatrace
          description: The log collector that is configured for the App Service.
          example: datadog
        configState:
          type: string
          enum:
            - disabled
            - disabling
            - enabled
            - enabling
            - paused
            - pausing
            - errored
          description: |
            The current configuration state of log streaming for the App Service. This indicates if log streaming has been set up on the nodes.

            Use the streamingState field to determine whether log streaming is actively streaming logs or not.
          example: enabled
        streamingState:
          type: string
          enum:
            - unknown
            - unsupported
            - healthy
            - degraded
            - unhealthy
          description: |
            This indicates if logs are being successfully streamed from the App Service nodes.

            The states meanings are:
              - unknown - There is not enough data for us to determine if successfully streaming. Make sure the config state is enabled, that logs have been generated for the log levels and keys selected for the App Endpoints, then wait and check again.
              - unsupported - The App Service version does not support the ability to determine if successfully streaming. Upgrade the App Service to version 3.3.2-2.0.0 or above to enable state checking.
              - healthy: Logs are being successfully streamed from all nodes.
              - degraded: At least one node has failed to stream logs. This could mean a transient problem streaming to the log collector, so check your log collector health.
              - unhealthy: All nodes are failing to stream logs. This could indicate a problem to contact the log collector, so make sure you have the right credentials setup.

            In case of a configuration change (e.g. credential change) or an error occurring while streaming logs, the streaming state may temporarily reflect the previous status for a few minutes, before transitioning to the correct state.
          example: healthy
