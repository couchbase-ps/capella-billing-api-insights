    OIDCProvider:
      type: object
      required:
        - issuer
        - clientId
      properties:
        issuer:
          type: string
          example: https://example.auth.com
          description: The URL for the OpenID Connect issuer.
        register:
          type: boolean
          example: true
          description: Indicates whether to register a new App Service user account when a user logs in using OpenID Connect.
        clientId:
          type: string
          example: foo_client
          description: The OpenID Connect provider client ID.
        userPrefix:
          type: string
          example: fooOIDC
          description: Username prefix for all users created for this provider
        discoveryUrl:
          type: string
          example: https://foo.com/.well-known/openid-configuration
          description: The URL for the non-standard discovery endpoint.
        usernameClaim:
          type: string
          example: fooAlt
          description: Allows a different OpenID Connect field to be specified instead of the Subject (sub).
        rolesClaim:
          type: string
          example: roles
          description: |
            If set, the value(s) of the given OpenID Connect authentication token claim will be added to the user's roles.
            The value of this claim in the OIDC token must be either a string or an array of strings, any other type will result in an error.
        providerId:
          type: string
          readOnly: true
          description: UUID of the provider.
        isDefault:
          type: boolean
          readOnly: true
          description: Indicates whether this is the default OpenID Connect provider.
        scope:
          type: array
          items:
            type: string
          example:
            - openid
            - email
            - profile
          description: The scope sent for the OpenID Connect request.
          default:
            - openid
            - email
      example:
        issuer: https://foo.com
        register: true
        clientId: foo_client
        userPrefix: fooOIDC
        discoveryUrl: https://foo.com/.well-known/openid-configuration
        usernameClaim: fooAlt
        scope:
          - openid
          - foo
