    CreateDatabaseCredentialRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          description: |
            Username for the database credential. The name should adhere to the following rules:

            1. The name must be between 2 & 128 characters.

            2. The name cannot contain spaces.

            3. The name cannot contain the following characters - `) ( > < , ; : " \ / ] [ ? = } {`

            4. The name cannot begin with `@` character.
          example: RW
          maxLength: 128
          minLength: 2
        password:
          type: string
          description: |
            A password associated with the database credential. If this field is left empty, a password will be auto-generated.

            - The password should adhere to the following rules:

              1. The password should have at least 8 characters.

              2. Characters used for the password should contain at least one uppercase (A-Z), one lowercase (a-z), one numerical (0-9), and one special character.

              3. The password must not contain any of the following characters: `< > ; . * & | £`
          example: Passw0rd!
          minLength: 8
        credentialType:
          type: string
          description: |
            The type of credential to create. Credential types determine the level of access control:

            - `basic`: Uses bucket-level access permissions. When omitted, this is the default.
            - `advanced`: Uses capella user roles for fine-grained RBAC access.

            When `basic` is used, the `access` field is required and `userRoles` must not be provided.
            When `advanced` is used, the `userRoles` field is required and `access` must not be provided.
          enum:
            - basic
            - advanced
          default: basic
          example: basic
        access:
          type: array
          description: |
            Describes the access information of the database credential.
            Required when creating a basic credential type. Must not be provided when creating an advanced credential type with user roles.
          items:
            $ref: '#/components/schemas/CredentialAccess'
        userRoles:
          type: array
          description: |
            A list of Capella user role names to assign to the database credential.
            Required when creating an advanced credential type. Must not be provided when creating a basic credential type with access.
            The provided user roles must already exist in the cluster.
          items:
            type: string
          example:
            - readInventory
            - analyticsReader
    CreateDatabaseCredentialResponse:
      type: object
      required:
        - id
        - password
      properties:
        id:
          type: string
          format: uuid
          example: ffffffff-aaaa-1414-eeee-000000000000
          description: The ID of the database credential created.
        password:
          type: string
          description: A password associated with the database credential. Password will have a minimum length of 8 characters and contain at least one lowercase letter, one uppercase letter, one number, and one special character.
          example: P@ssw0rd!
    CreateDatabaseRoleRequest:
      type: object
      required:
        - name
        - access
      properties:
        name:
          type: string
          description: |
            Name for the database user role. The name should adhere to the following rules:

            1. The name must be between 2 & 32 characters.

            2. The name cannot contain spaces.

            3. The name cannot contain the following characters - `) ( > < , ; : " \ / ] [ ? = } {`

            4. The name cannot begin with `@` character.
          example: RW
          maxLength: 32
          minLength: 2
        description:
          type: string
          description: Description for the database user role.
        access:
          type: array
          description: Describes the access information of the database user role.
          items:
            $ref: '#/components/schemas/RoleAccess'
    CreateDatabaseRoleResponse:
      type: object
      required:
        - id
      properties:
        id:
          type: string
          format: uuid
          example: ffffffff-aaaa-1414-eeee-000000000000
          description: The ID of the database user role created.
    CreateEventingFunctionRequest:
      type: object
      description: |
        The definition of an eventing function to create on a Capella cluster.
      required:
        - name
        - eventSource
        - eventMetadataStorage
      properties:
        name:
          type: string
          description: The name of the eventing function.
          minLength: 1
          maxLength: 100
          pattern: ^[a-zA-Z0-9][a-zA-Z0-9_-]*$
          example: my_function
        description:
          type: string
          nullable: true
          description: The eventing function description.
          example: Replicates document mutations to a downstream collection.
        code:
          type: string
          description: |
            The JavaScript code of the eventing function that gets executed in response to document mutations.

            The eventing service compresses the code before storing it. The compressed code must not exceed 128 KiB
            (131072 bytes); a function whose code is larger than this limit after compression is rejected.
          default: |
            function OnUpdate(doc, meta, xattrs) {
              // Add your mutation logic here
            }

            function OnDelete(meta, options) {
              // Add your delete handling logic here
            }
          example: |
            function OnUpdate(doc, meta, xattrs) {
              log("Doc created/updated", meta.id);
            }

            function OnDelete(meta, options) {
              log("Doc deleted/expired", meta.id);
            }
        eventSource:
          allOf:
            - $ref: '#/components/schemas/EventingFunctionKeyspace'
            - description: |
                The keyspace on which the function listens for document mutations. Every mutation on this collection is
                run through the eventing function code.

                The scope and collection may be a wildcard value of `*` to listen on all scopes or all collections; the
                bucket must reference a specific bucket. When the scope is `*`, the collection must also be `*`.
        eventMetadataStorage:
          allOf:
            - $ref: '#/components/schemas/EventingFunctionKeyspace'
            - description: |
                The keyspace used to store function associated metadata (such as checkpoints and timers).

                It must be different from the `eventSource` keyspace, and must reference a specific bucket, scope and
                collection - wildcards (`*`) are not permitted.
        settings:
          $ref: '#/components/schemas/EventingFunctionSettings'
        bindings:
          $ref: '#/components/schemas/EventingFunctionBindings'
