      name: status
      description: |
        Filter eventing functions by one or more status. When this query parameter is not set, all eventing functions will be returned no matter the state.
        Accepts a comma-separated list, or the same query parameter defined multiple times.
      in: query
      schema:
        type: array
        items:
          type: string
          enum:
            - deployed
            - deploying
            - undeployed
            - undeploying
            - paused
            - pausing
    EventsSortBy:
      in: query
      name: sortBy
      description: ' Sets the order of how you would like to sort the results and the key you would like to order by. Valid fields to sort the results are: **severity**, **timestamp**.'
      example:
        - timestamp
      required: false
      schema:
        type: array
        items:
          type: string
          enum:
            - timestamp
            - severity
