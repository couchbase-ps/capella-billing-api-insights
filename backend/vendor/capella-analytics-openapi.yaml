      properties:
        replicationId:
          type: string
          description: The ID of the replication. This field is present for both oneWay and twoWay replications.
          example: MDIwN23ewrerfetrmZmUzYzExYTcxMTA4MjJkYjJiNmYvdGVzdDEvdGVzdDI=
        reverseReplicationId:
          type: string
          description: The ID of the replication from target to source. This field is only present for twoWay replications.
          example: MDIwN23ewrerfetrmZmUzYzExYTcxMTA4MjJkYjJiNmYvdGVzdDEvdGVzdDI=
    CreateReplicationRequest:
      type: object
      required:
        - sourceBucket
        - target
      properties:
        sourceBucket:
          type: string
          description: The ID of the source bucket.
          example: dGVzdA
        target:
          type: object
          description: Target contains all the metadata about a replication target.
          required:
            - cluster
            - bucket
          properties:
            cluster:
              type: string
              description: |
                The target cluster identifier. 
                - For Capella clusters, use cluster ID
                - For external clusters, use cluster reference name
              example: b95f56d2-d4c4-425c-8df6-eee7c2c8edab
            bucket:
              type: string
              description: |
                The target bucket identifier. 
                - For Capella buckets, use bucket ID
                - For external clusters, use bucket name
              example: dPVzdB
            type:
              type: string
              description: Type tells us if the target cluster is capella or external.
              enum:
                - capella
                - external
              default: capella
        mode:
          type: string
          description: This specifies the replication creation mode.
          enum:
            - async
            - sync
          default: async
          example: async
        mappings:
          $ref: '#/components/schemas/mappings'
        direction:
          type: string
          description: Direction specifies the replication flow — whether it's oneWay (source to target only) or twoWay (also from target back to source).
          enum:
            - oneWay
            - twoWay
          default: oneWay
          example: oneWay
        priority:
          type: string
          description: |
            Priority represents the resource allocation to the replication.

            - low: Resource constraints are applied when competing with high priority replications
            - medium: Resource constraints are applied during initial processing when competing with high priority replications, then operates as high priority
            - high: No resource constraints are applied (default priority)
          enum:
            - low
            - medium
            - high
          default: high
          example: high
        networkUsageLimit:
          type: integer
          default: 0
          description: Network usage limit in MiB per second. 0 means unlimited.
          example: 100
        filter:
          $ref: '#/components/schemas/filter'
    CreateReplicationResponseAsync:
      type: object
      required:
        - jobId
      properties:
        jobId:
          type: string
          description: The ID of the job for the async creation of the replication.
          example: a83d322a-8350-4e77-8708-2b4e961a4259
