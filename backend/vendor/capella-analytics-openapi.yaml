        iops:
          type: integer
          description: Only required for Ultra Disk types. Not used in other storage types. See [IOPS Defaults](https://docs.couchbase.com/cloud/clusters/scale-database.html#IOPS-Defaults) for a list of supported IOPS values.
          example: 3000
        autoExpansion:
          type: boolean
          description: Determine if disk storage should automatically expand. Defaults to "false" if not specified.
          example: false
    DiskGCP:
      type: object
      required:
        - type
        - storage
      properties:
        type:
          type: string
          description: Type of disk. Please choose from the given list for GCP cloud provider.
          enum:
            - pd-ssd
        storage:
          type: integer
          description: Storage in GB. Please refer to documentation for supported storage.
          example: 50
          minimum: 50
    DurabilityLevel:
      type: string
      description: |
        This is the minimum level at which all writes to the bucket must occur.

         The options for Durability level are as follows, according to the bucket type.

         - For a Couchbase bucket:

           1. None

           2. Replicate to Majority

           3. Majority and Persist to Active

           4. Persist to Majority

         - For an Ephemeral bucket:

           1. None

           2. Replicate to Majority

         To learn more, see [Create a Bucket](https://docs.couchbase.com/cloud/clusters/data-service/manage-buckets.html#add-bucket).
      enum:
        - none
        - majority
        - majorityAndPersistActive
        - persistToMajority
      default: none
    EditCloudSnapshotBackupRetentionRequest:
      type: object
      properties:
        retention:
          type: integer
          description: Represents interval in hours to retain the backup.
          example: 730
    EditColumnarAnalyticsBackupRetentionRequest:
      type: object
      properties:
        retention:
          type: integer
          description: Represents interval in hours to retain the backup.
          example: 720
      required:
        - retention
    Email:
      type: string
      description: Email of the user.
      example: john.doe@example.com
    EmbeddingDimensions:
      type: object
      required:
        - supported
        - default
      properties:
        supported:
          type: array
          items:
            type: integer
          description: All the supported dimensions of the embedding vector produced by the model.
          example:
            - 512
            - 1024
        default:
          type: integer
          description: The default dimension of the embedding vector produced by the model.
          example: 512
    EnableAwsPrivateEndpointServiceRequest:
      type: object
      properties:
        routes:
          allOf:
            - $ref: '#/components/schemas/PrivateEndpointRoutes'
            - description: Optional routes configuration to enable for private endpoints. If not provided, defaults to false.
    EnableCMEKAzureRequest:
      type: object
      required:
        - cloudProvider
      properties:
        cloudProvider:
          type: string
          description: Cloud provider for CMEK keys.
          enum:
            - azure
          example: azure
    EnableCrossClusterVersioning:
      type: boolean
      description: |
        This being enabled is a pre-requisite to a few XDCR features.

        When enabled, each document processed by XDCR will have additional metadata stored, called the Hybrid Logical Vector (HLV), in the document extended attributes (xattrs).

        The Cross Cluster Versioning setting cannot be disabled after it is enabled. By default, this value reflects what its current value is in the bucket, so omit this setting to leave it as it's current value.

        See the documentation for enableCrossClusterVersioning and the dependent features for important details on when to enable this setting.
    Error:
      type: object
      required:
        - httpStatusCode
        - message
        - code
        - hint
      properties:
        httpStatusCode:
          type: integer
        code:
          type: integer
        message:
          type: string
        hint:
          type: string
    EventingFunction:
      type: object
      description: |
        The definition of a retrieved eventing function on a Capella cluster.
      required:
        - name
        - eventSource
        - eventMetadataStorage
      properties:
        name:
          type: string
          description: The name of the eventing function.
          minLength: 1
          maxLength: 100
          pattern: ^[a-zA-Z0-9][a-zA-Z0-9_-]*$
          example: my_function
        description:
          type: string
          nullable: true
          description: The eventing function description.
          example: Replicates document mutations to a downstream collection.
        status:
          $ref: '#/components/schemas/EventingFunctionStatus'
        code:
          type: string
          description: |
            The JavaScript code of the eventing function that gets executed in response to document mutations.
          example: |
            function OnUpdate(doc, meta, xattrs) {
              log("Doc created/updated", meta.id);
            }

            function OnDelete(meta, options) {
              log("Doc deleted/expired", meta.id);
            }
        eventSource:
          allOf:
            - $ref: '#/components/schemas/EventingFunctionKeyspace'
            - description: |
                The keyspace on which the function listens for document mutations. Every mutation on this collection is
                run through the eventing function code.

                The scope and collection may be a wildcard value of `*` to listen on all scopes or all collections; the
                bucket must reference a specific bucket. When the scope is `*`, the collection must also be `*`.
        eventMetadataStorage:
          allOf:
            - $ref: '#/components/schemas/EventingFunctionKeyspace'
            - description: |
                The keyspace used to store function associated metadata (such as checkpoints and timers).
                It must be different from the `eventSource` keyspace, and must reference a specific bucket, scope and
                collection - wildcards (`*`) are not permitted.
        settings:
          $ref: '#/components/schemas/EventingFunctionSettings'
        bindings:
          $ref: '#/components/schemas/EventingFunctionBindings'
    EventingFunctionBindings:
      type: object
      description: |
        A binding is a construct that lets you separate environment-specific variables, like keyspace names, external
        endpoint URLs and credentials, and global constants, from the source code of the Eventing Function.

        A binding provides indirection between environment-specific artifacts and symbolic names, and helps move a function
        definition from a development to a production environment without changing the eventing code. Binding names must be
        valid JavaScript identifiers, and cannot conflict with built-in types.

        An Eventing Function can have no bindings, one binding, or several bindings. Aliases must be unique across all three binding types.
      properties:
        buckets:
          type: array
          description: |
            Bucket bindings that give the eventing function direct access to documents in a collection.

            A wildcard value of `*` can be used for the bucket, scope or collection to give the eventing function access to multiple keyspaces. A wildcard must cascade down the hierarchy: a wildcard bucket requires a wildcard scope and collection, and a wildcard scope requires a wildcard collection.
            In this case, only the [Advanced Keyspace Accessors](https://docs.couchbase.com/cloud/eventing/eventing-advanced-keyspace-accessors.html) can read or write to the bucket from the eventing function code.
          items:
            $ref: '#/components/schemas/EventingFunctionBucketBinding'
        urls:
          type: array
          description: |
            URL bindings that the eventing function can use to access external resources. Each binding specifies the endpoint, the
            HTTP or HTTPS protocol, and the credentials used to authenticate with the remote host.

            URL bindings can be used by the `curl` function in the eventing function code.
          items:
            $ref: '#/components/schemas/EventingFunctionUrlBinding'
        constants:
          type: array
          description: Constant bindings that expose a fixed value to the eventing function code as a global variable.
          items:
            $ref: '#/components/schemas/EventingFunctionConstantBinding'
    EventingFunctionBucketBinding:
      type: object
      required:
        - alias
        - bucket
      properties:
        alias:
          type: string
          pattern: ^[a-zA-Z_$][a-zA-Z0-9_$]*$
          minLength: 1
          maxLength: 64
          description: The name used to refer to the bound collection from the eventing function code.
          example: src
        bucket:
          type: string
          pattern: ^(\*|[a-zA-Z0-9_%-][a-zA-Z0-9._%-]*)$
          minLength: 1
          maxLength: 100
          description: |
            The name of the bucket that the alias resolves to. Can be a wildcard value of `*` to give the eventing function
            access to all buckets. When the bucket is `*`, the scope and collection must also be `*`.
          example: travel-sample
        scope:
          type: string
          description: |
            The name of the scope within the bucket that this alias binds to. Can be a wildcard value of `*` to give the
            eventing function access to all scopes in the bucket. When the scope is `*`, the collection must also be `*`.
          default: _default
          example: '*'
        collection:
          type: string
          description: The name of the collection within the scope that this alias binds to. Can be a wildcard value of `*` to give the eventing function access to all collections in the scope.
          default: _default
          example: '*'
        permission:
          type: string
          description: |
            The level of access the eventing function has on the bound collection.

            - `read`: the eventing function can read documents from the collection but cannot create, update, or delete them.
            - `readWrite`: the eventing function can read documents from, and write documents to, the collection.
          enum:
            - read
            - readWrite
          default: read
          example: readWrite
    EventingFunctionConstantBinding:
      type: object
      required:
        - alias
        - value
      properties:
        alias:
          type: string
          pattern: ^[a-zA-Z_$][a-zA-Z0-9_$]*$
          minLength: 1
          maxLength: 64
          description: The global variable name under which the value is exposed to the eventing function code.
          example: maxRetries
        value:
          type: string
          minLength: 1
          description: The literal value the alias resolves to when referenced from the eventing function code.
          example: '3'
    EventingFunctionKeyspace:
      type: object
      description: |
        A reference to a Couchbase keyspace, identified by its bucket, scope, and collection.
      required:
        - bucket
      properties:
        bucket:
          type: string
          pattern: ^[a-zA-Z0-9_%-][a-zA-Z0-9._%-]*$
          minLength: 1
          maxLength: 100
          description: The name of the bucket.
          example: travel-sample
        scope:
          type: string
          description: The name of the scope within the bucket.
          default: _default
          example: inventory
        collection:
          type: string
          description: The name of the collection within the scope.
          default: _default
          example: airline
    EventingFunctionSettings:
      type: object
      description: |
        Runtime settings that control how the function is executed.
      properties:
        workerCount:
          type: integer
          minimum: 1
          maximum: 64
          description: |
            The number of worker processes the function uses on each Eventing node. Increasing this value can improve
            throughput at the cost of additional CPU and memory consumption.
          default: 1
          example: 1
        scriptTimeout:
          type: integer
          minimum: 1
          description: |
            The maximum duration, in seconds, that a single invocation (from start to finish) of the eventing function is permitted to run before it is
            terminated.
          default: 60
          example: 30
        sqlConsistency:
          type: string
          description: |
            The consistency level used by SQL++ (N1QL) statements executed from within the eventing function.

            - `none`: queries execute without waiting for any specific indexer state.
            - `request`: queries wait for indexes to incorporate all mutations made up to the time the query was issued.
          enum:
            - none
            - request
          default: none
          example: request
        languageCompatibility:
          type: string
          description: |
            The language version of the Eventing Function for backward compatibility.

            This ensures that when a cluster is upgraded, existing functions continue to operate without modification.

            When a new language version is released, functions can be migrated to it to take advantage of new features and improvements.
          enum:
            - 6.0.0
            - 6.5.0
            - 6.6.2
            - 7.2.0
          default: 7.2.0
          example: 7.2.0
        feedBoundary:
          type: string
          description: |
            The position at which the eventing function starts processing mutations when it is first deployed.

            Note that an eventing function is created in an `undeployed` state, and does not start processing mutations until it is deployed.

            - `everything`: process the entire history of mutations on the source collection.
            - `from_now`: only process mutations that occur after the function is deployed.
          enum:
            - everything
            - from_now
          default: from_now
          example: everything
        maxTimerContextSize:
          type: integer
          minimum: 20
          maximum: 20971520
          description: |
            The maximum size, in bytes, of the context object that can be attached to a Timer created by the Eventing Function.

            A context can be any JSON document. Timers can store and access a context, which is then used to store the state of when a Timer is created and to retrieve the state of when a Timer is fired.
          default: 1024
          example: 1024
        allowSyncDocuments:
          type: boolean
          description: |
            Determines whether the function is permitted to process mutations on documents managed by App Services. When set to `false`, documents prefixed with `_sync` are skipped.

            Set `allowSyncDocuments` to `false` and `cursorAware` to `true` for App Services compatibility.
          default: true
          example: false
        cursorAware:
          type: boolean
          description: |
            When `true`, the function suppresses potential duplicate mutations originating from App Services,
            guaranteeing that the eventing function is invoked at most once per logical mutation.

            Set `allowSyncDocuments` to `false` and `cursorAware` to `true` for App Services compatibility.

            A maximum of 5 cursor-aware eventing functions can be deployed against a single source keyspace; deploying
            a cursor-aware function beyond this limit is rejected.
          default: false
          example: true
    EventingFunctionStatus:
      type: string
      description: |
        The current status that the eventing function is in.

        - `deployed`: the function is active and processing events.
        - `undeployed`: the function exists but is not processing events.
        - `paused`: the function is deployed but is not currently processing events. Resuming will cause it to carry on processing events from where it was paused.
        - `deploying`: the function is transitioning from `undeployed` or `paused` to `deployed`.
        - `undeploying`: the function is transitioning from `deployed` or `paused` to `undeployed`.
        - `pausing`: the function is transitioning from `deployed` to `paused`.
      enum:
        - deployed
        - undeployed
        - paused
        - deploying
        - undeploying
        - pausing
      readOnly: true
      example: deployed
    EventingFunctionUrlBinding:
      type: object
      required:
        - alias
        - url
      properties:
        alias:
          type: string
          pattern: ^[a-zA-Z_$][a-zA-Z0-9_$]*$
          minLength: 1
          maxLength: 64
          description: The name used to refer to the bound endpoint from the eventing function code.
          example: api
        url:
          type: string
          format: uri
          pattern: ^https?:\/\/
          description: The fully qualified endpoint URL, including the HTTP or HTTPS scheme, that requests are sent to.
          example: https://api.example.com/path
        allowCookies:
          type: boolean
          description: |
            Whether the eventing function should allow cookies on the session.
          default: false
          example: true
        validateTLSCertificate:
          type: boolean
          description: |
            Whether the TLS certificate presented by the remote host is validated when establishing the connection.

            Defaults to `true`. This must be explicitly set to `false` when the `url` uses the `http://` scheme, as there is no TLS
            certificate to validate on a plaintext connection.
          default: true
          example: true
        authentication:
          $ref: '#/components/schemas/URLBindingAuthentication'
    EvictionPolicy:
      type: string
      description: |
        The policy which Capella adopts to prevent data loss due to memory exhaustion.
        This may be also known as Ejection Policy in the Couchbase documentation. 

        - For Couchbase bucket, Eviction Policy is `fullEviction` by default.

        - For Ephemeral buckets, Eviction Policy is a required field, and should be one of the following:

           1. noEviction

           2. nruEviction

          To learn more, see [Ejection Policy](https://docs.couchbase.com/server/current/rest-api/rest-bucket-create.html#evictionpolicy).
      enum:
        - fullEviction
        - noEviction
        - nruEviction
      example: fullEviction
      default: fullEviction
    ExternalEmbeddingModel:
      type: object
      required:
