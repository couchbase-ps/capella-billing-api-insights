    GetWorkflowRunResponse:
      type: object
      required:
        - id
        - status
        - createdAt
        - createdByUserID
      properties:
        id:
          type: string
          description: |
            The unique identifier for the workflow run.
        status:
          type: string
          enum:
            - deploying
            - running
            - completed
            - partiallyCompleted
            - failed
            - stopping
          description: |
            The current state of the workflow run:
              * `deploying`: The workflow run is being deployed
              * `running`: The workflow run is executing
              * `completed`: The workflow run finished successfully
              * `partiallyCompleted`: The workflow run finished with some errors
              * `failed`: The workflow run failed
              * `stopping`: The workflow run is being stopped

            **Actions:**
              * To retry a failed workflow run, send a POST request to `/aiServices/workflows/{workflowId}`
              * To retrieve all processed files (including both successful and failed), send a GET request to `/aiServices/workflows/{workflowId}/runs/{runId}/processedFiles`
        totalFiles:
          type: integer
          description: Total number of files that are picked up by the workflow run.
        processedFiles:
          type: integer
          description: Number of files that have been processed in the workflow run.
        erroredFiles:
          type: integer
          description: Number of files that errored out while processing in the workflow run.
        createdAt:
          type: string
          description: |
            The date and time when the workflow run was created.
          format: timestamp
          example: '2021-01-01T00:00:00Z'
        createdByUserID:
          type: string
          description: |
            The unique identifier for the user who created the workflow run.
    GetWorkflowRunsResponse:
