    post:
      summary: Get Columnar Private Endpoint CLI Command required to setup private endpoint for specific CSP
      description: |
        Retrieve the command or script to be executed in order to create the private endpoint which will provides a private connection between the specified VPC and the specified Capella private endpoint service.  
        Currently only available for AWS. An example for AWS:

        ```
        aws ec2 create-vpc-endpoint \
          --vpc-id vpc-1234 \
          --region us-east-1 \
          --service-name com.amazonaws.vpce.us-east-1.vpce-svc-1234 \
          --vpc-endpoint-type Interface \
          --subnet-ids subnet-1234
        ```

        In order to access this endpoint, the provided API key must have at least one of the following roles:
          - Organization Owner
          - Project Owner
          - Project Manager
          - Project Viewer

          To learn more, see [Organization, Project, and Database Access Overview](https://docs.couchbase.com/cloud/organizations/organization-projects-overview.html).
      tags:
        - Columnar Analytics Private Endpoint Service
      operationId: getColumnarPrivateEndpointServiceCommand
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePrivateEndpointServiceCommandRequest'
            examples:
              PostColumnarAnalyticsAWSCommandRequest:
                value:
                  vpcID: vpc-1234
                  subnetIDs:
                    - subnet-1234
      responses:
        '200':
          description: Successfully provided command to create a private endpoint.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatePrivateEndpointServiceCommandResponse'
        '400':
