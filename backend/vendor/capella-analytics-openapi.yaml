      required:
        - name
      properties:
        id:
          type: string
          description: The channel ID. Populated only when resolved via the Slack API.
          example: C01234ABCDE
        name:
          type: string
          description: The channel name (without the leading `#` for Slack).
          example: alerts
        type:
          type: string
          description: Slack channel visibility. Populated only when resolved via the Slack API.
          enum:
            - public
            - private
          example: public
    CloudAccounts:
      type: object
