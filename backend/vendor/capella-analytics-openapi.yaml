        - id
        - sourceCluster
        - targetCluster
        - status
        - audit
      properties:
        id:
          type: string
          description: The ID of the specified replication.
          example: MDIwN23ewrerfetrmZmUzYzExYTcxMTA4MjJkYjJiNmYvdGVzdDEvdGVzdDI=
        sourceCluster:
          type: string
          description: The name of the source cluster.
          example: SourceCluster
        targetCluster:
          type: string
          description: The name of the target cluster.
          example: TargetCluster
        status:
          type: string
          description: The status of the replication.
          enum:
            - pending
            - pausing
            - failed
            - paused
            - running
          example: running
        direction:
          type: string
          description: Direction specifies the replication flow — whether it's oneWay (source to target only) or twoWay (also from target back to source).
          enum:
            - oneWay
            - twoWay
          default: oneWay
        audit:
          $ref: '#/components/schemas/ReplicationAuditData'
    replicationTarget:
      type: object
      description: Target contains all the metadata about a replication target.
      required:
        - cluster
        - bucket
        - type
      properties:
        project:
          type: object
          description: Project contains the metadata for the destination to which the replication is established.
          properties:
            id:
              type: string
              example: 55619517-6fg1-5c1c-cf0g-g42edd533fb1
            name:
              type: string
              example: TargetProject
        cluster:
          type: object
          description: Cluster contains the metadata for the destination to which the replication is established.
          required:
            - id
            - name
          properties:
            id:
              type: string
              example: b95f56d2-d4c4-425c-8df6-eee7c2c8edab
            name:
              type: string
              example: TargetCluster
        bucket:
          type: object
          description: Bucket contains the metadata for the destination to which the replication is established.
          required:
            - id
            - name
          properties:
            id:
              type: string
              example: dPVzdB
            name:
              type: string
              example: TargetBucket
            conflictResolutionType:
              type: string
              example: seqno
        scopes:
          $ref: '#/components/schemas/scopes'
        type:
          type: string
          description: Type tells us if the target cluster is capella or external.
          enum:
            - capella
            - external
          default: capella
    scopes:
      type: array
      description: Scopes and collections details for the cluster. Empty for full bucket replication.
      items:
        type: object
        properties:
          name:
            type: string
            example: scope-1
          collections:
            $ref: '#/components/schemas/collections'
    splunk:
      type: object
      required:
        - splunkToken
        - url
      properties:
        splunkToken:
          type: string
          description: The token for the Splunk log collector
        url:
          type: string
          description: The URL for the Splunk log collector
      example:
        splunkToken: SplunkToken
        url: https://splunk:8088
    sumologic:
      type: object
      required:
        - url
      properties:
        url:
          type: string
          description: The SumoLogic signed URL for the log ingestion
      example:
        url: https://endpoint1.collection.us2.sumologic.com/receiver/v1/http/AaBbCc12345678
  responses:
    AIGatewayNotFound:
      description: AI Gateway doesn't exist for the tenant in the specified region.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            ResourceNotFound:
              value:
                httpStatusCode: 404
                code: 404
                message: The requested AI Gateway could not be found.
                hint: Please review your request and ensure that all required parameters are correctly provided.
    AccessForbidden:
      description: The client does not have the necessary permissions to access this resource.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            AccessForbidden:
              value:
                httpStatusCode: 403
                code: 1002
                message: Access Denied.
                hint: Your access to the requested resource is denied. Please make sure you have the necessary permissions to access the resource.
    AppEndpointAccessForbidden:
      description: |
        The client does not have the necessary permissions to access this resource. This response can also indicate that
        the requested App Endpoint or bucket does not exist or the user does not have access to it.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            AccessForbidden:
              $ref: '#/components/responses/AccessForbidden/content/application~1json/examples/AccessForbidden'
    BadRequest:
      description: Returned when we are unable to decode the recevied payload.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            BadRequest:
              value:
                httpStatusCode: 400
                code: 1000
                message: The request was malformed or invalid.
                hint: The request was malformed or invalid.
    Conflict:
      description: Returned when there is a conflict with the current state of a resource.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            Conflict:
              value:
                httpStatusCode: 409
                code: 1010
                message: There is a conflict with the current state of a resource.
                hint: Returned when trying to create or update a resource that already exists or has conflicting information.
    GatewayTimeout:
      description: The server did not get a response in time from the upstream server in order to complete the request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            GatewayTimeout:
              value:
                httpStatusCode: 504
                code: 1002
                message: The request timed out while waiting for a response from the upstream server.
                hint: The server exceeded the deadline for a response. Please try again.
    IndexNotFound:
      description: Index with specified name was not found in case of DELETE, ALTER or BUILD.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            ResourceNotFound:
              value:
                httpStatusCode: 404
                code: 404
                message: The index was not found.
                hint: Check if the index exists in the collection.
    InternalServerError:
      description: An unexpected error occurred in the server while processing this request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            InternalServerError:
              value:
                httpStatusCode: 500
                code: 10000
                message: An internal server error occurred.
                hint: Something went wrong on our end. We are actively investigating the issue.
    NotImplemented:
      description: The server does not support the functionality required to fulfill the request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            NotImplemented:
              value:
                httpStatusCode: 501
                code: 1011
                message: The requested functionality is not implemented.
                hint: Returns when the server does not support the functionality required to fulfill the request.
    PreconditionFailed:
      description: Returned when there is a mismatch with the Etag version.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            PreconditionFailed:
              value:
                httpStatusCode: 412
                code: 1012
                message: The request precondition failed. The resource state does not meet the conditions specified in the request headers.
                hint: Please Verify the precondition headers (e.g., If-Match, If-Unmodified-Since) and ensure they align with the current state of the resource.
    RateLimitExceeded:
      description: Returned when the client exceeds the rate limit for the given APIKey.
      headers:
        Retry-After:
          schema:
            type: string
            description: The amount of time, in seconds, that the client should wait before sending subsequent requests.
            example: 'Retry-After: 60'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            RateLimitExceeded:
              value:
                httpStatusCode: 429
                code: 1004
                message: Oops! You've made too many requests. Please wait for time specified in the retryAfter header before trying again.
                hint: The number of requests allowed per API key has exceeded. Please retry after time specified in the retryAfter header has passed.
    ResourceNotFound:
      description: The requested resource was not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            ResourceNotFound:
              value:
                httpStatusCode: 404
                code: 3000
                message: The server cannot find the resource.
                hint: The server cannot find the resource.
    ServiceUnavailable:
      description: The server is currently unable to handle the request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            InternalServerError:
              value:
                httpStatusCode: 503
                code: 1007
                message: The server is currently unable to handle the request.
                hint: Please ensure the resource is in the correct state to handle requests.
    Unauthorized:
      description: The client does not have the valid credentials to access this resource.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            Unauthorized:
              value:
                httpStatusCode: 401
                code: 1001
                message: The request is unauthorized. Please ensure you have proper authentication credentials and try again.
                hint: The request is unauthorized. Please ensure you have proper authentication credentials and try again.
    UnprocessableContent:
      description: Request validation error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            UnprocessableContent:
              value:
                httpStatusCode: 422
                code: 1005
                message: The server can't process the content.
                hint: The server can't process the content.
  headers:
    ETag:
      description: Entity tag for the resource, used for caching and conditional requests.
      schema:
        type: string
        example: 'Version: 1'
        description: |
          An ETag is a unique identifier assigned to a specific version of a resource on a web server.
          It allows the server to identify whether the version of the resource on the client side matches the version on the server side.
          This field represents the ETag value returned by the server for a particular resource.
  securitySchemes:
    token:
      type: http
      scheme: bearer
