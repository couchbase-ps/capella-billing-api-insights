          description: The state of the job.
          enum:
            - pending
            - processing
            - complete
            - failed
            - skipped
            - killed
            - notfound
            - unknown
          example: pending
        retryNumber:
          type: integer
          description: The attempt number for the job.
          example: 1
        lastError:
          type: string
          description: The last error message if the job encountered an error.
          example: fake error
        replicationId:
          type: string
          description: The ID of the created replication. Only present if the job is complete.
          example: UmlqdSBpcyBhd2Vzb21l
        reverseReplicationId:
          type: string
          description: The ID of the inverse replication if the direction is twoWay.
          example: MDIwN23ewrerfetrmZmUzYzExYTcxMTA4MjJkYjJiNmYvdGVzdDEvdGVzdDI
        lastUpdatedTimestamp:
          type: string
          format: date-time
          description: The timestamp of the last modification of the job record.
          example: '2021-09-01T12:34:56Z'
    GetReplicationResponse:
      type: object
      required:
        - id
        - status
        - changesLeft
        - source
        - target
        - direction
        - audit
      properties:
        id:
          type: string
          description: The ID of the specified replication.
          example: MDIwN23ewrerfetrmZmUzYzExYTcxMTA4MjJkYjJiNmYvdGVzdDEvdGVzdDI=
        status:
          type: string
          description: The status of the replication.
          enum:
            - pending
            - pausing
            - failed
            - paused
            - running
          example: running
        changesLeft:
          type: integer
          description: The number of remaining mutations to the replication.
          example: 100
        error:
          type: string
          description: The error message if the replication has failed.
          example: Replication failed because of a timeout
        source:
          $ref: '#/components/schemas/replicationSource'
        target:
          $ref: '#/components/schemas/replicationTarget'
        mappings:
          $ref: '#/components/schemas/mappings'
        direction:
          type: string
          description: Direction specifies the replication flow — whether it's oneWay (source to target only) or twoWay (also from target back to source).
          enum:
            - oneWay
            - twoWay
          default: oneWay
        priority:
          type: string
          description: |
            Priority represents the resource allocation to the replication.

            - low: Resource constraints are applied when competing with high priority replications
            - medium: Resource constraints are applied during initial processing when competing with high priority replications, then operates as high priority
            - high: No resource constraints are applied (default priority)
          enum:
            - low
            - medium
            - high
          default: high
        networkUsageLimit:
          type: integer
          default: 0
          description: Network usage limit in MiB per second. 0 means unlimited.
        filter:
          $ref: '#/components/schemas/getFilter'
        audit:
          $ref: '#/components/schemas/ReplicationAuditData'
    GetS3ConfigurationResponse:
      type: object
      properties:
        awsRegion:
          type: string
          description: The AWS region the S3 bucket is located in.
        bucket:
          type: string
          description: The name of the S3 bucket.
        folderPath:
          type: string
          description: The path to the folder in the S3 bucket where the files are stored. Empty denotes the root folder.
    GetScheduledBackupResponse:
