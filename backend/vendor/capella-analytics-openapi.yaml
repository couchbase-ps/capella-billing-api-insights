    UpdateReplicationRequest:
      type: object
      properties:
        priority:
          type: string
          description: |
            Priority represents the resource allocation to the replication.

            - low: Resource constraints are applied when competing with high priority replications
            - medium: Resource constraints are applied during initial processing when competing with high priority replications, then operates as high priority
            - high: No resource constraints are applied (default priority)
          enum:
            - low
            - medium
            - high
          default: high
          example: high
        networkUsageLimit:
          type: integer
          description: Network usage limit in MiB per second. Default is 0 meaning it is unlimited.
          example: 100
          default: 0
        filter:
          $ref: '#/components/schemas/filter'
        allScopes:
          type: boolean
          description: |
            If true, all scopes will be replicated.
            If false, the scopes specified in the mappings field will be replicated.
          default: false
        mappings:
          $ref: '#/components/schemas/mappings'
    UpdateRequestConfig:
