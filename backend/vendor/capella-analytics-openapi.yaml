    CredentialAccess:
      type: object
      required:
        - privileges
      properties:
        privileges:
          type: array
          items:
            type: string
          description: |
            The bucket-level privileges granted to the database credential. Each privilege is applied to
            the resources listed in `resources`, up to the finest level of granularity the privilege
            supports.

            A `basic` credential supports read and write access only, so the only accepted values are
            `read`, `write`, `data_reader` and `data_writer`. `read` is an alias for `data_reader` and
            `write` is an alias for `data_writer`; any other value is rejected.

            For fine-grained privileges such as `queryManage` or `analyticsSelect`, create an `advanced`
            credential and assign it database user roles through `userRoles` instead.
          example:
            - data_reader
            - data_writer
        resources:
          type: object
          description: The resources for which access will be granted on. Leaving this empty will grant access to all buckets.
          properties:
            buckets:
              type: array
              items:
                $ref: '#/components/schemas/ResourceBucket'
