      name: clusterId
      description: |
        Filters by clusterId.
      in: query
      schema:
        type: string
        format: uuid
        description: Filter to fetch appservices belonging to a particular cluster.
    FilterByRegion:
      in: query
      name: filterBy
      description: |
        Filter criteria in the format 'field:operator:value'. 
        Supported operators are 'eq' (equals). 
        Currently, only 'region' is supported as a filter field.
        Example: region:eq:us-east-1
      required: false
      schema:
        type: string
        example: region:eq:us-east-1
    From:
      name: from
      description: Start date in  RFC3339 format. If not provided, events starting from last 24 hours are returned.
      in: query
      schema:
        type: string
        format: date-time
        example: '2024-04-24T12:53:59.000Z'
    FunctionName:
      name: functionName
      description: The name of the eventing function to target.
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 100
        pattern: ^[a-zA-Z0-9][a-zA-Z0-9_-]*$
        example: my_eventing_function
