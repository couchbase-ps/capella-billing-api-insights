          description: Controls the verbosity of logs based on the specified log level
        logKeys:
          type: array
          items:
            type: string
            enum:
              - Admin
              - Access
              - Auth
              - Cache
              - Changes
              - CRUD
              - HTTP
              - HTTP+
              - Import
              - Javascript
              - Query
              - Sync
              - SyncMsg
          description: Filter logs to specific log keys
          example:
            - HTTP
            - Query
            - Sync
      example:
        logLevel: warn
        logKeys:
          - HTTP
          - Import
          - Sync
    CouchbaseAuditData:
