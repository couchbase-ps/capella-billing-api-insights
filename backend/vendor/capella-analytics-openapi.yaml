    CreateBedrockConfigurationRequest:
      type: object
      description: |
        Configuration for AWS Bedrock provider. Supports two mutually exclusive authentication methods:
        1. API Key authentication: Provide 'apiKey' and 'region'
        2. IAM credentials authentication: Provide 'accessKeyId' and 'secretAccessKey'
        The authentication method is locked once the provider is created.
      properties:
        accessKeyId:
          type: string
          description: The AWS access key ID for IAM credentials authentication.
          example: AKIAIOSFODNN7EXAMPLE
        secretAccessKey:
          type: string
          description: The AWS secret access key for IAM credentials authentication.
          example: wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
        apiKey:
          type: string
          description: The AWS Bedrock API key for API key authentication. Mutually exclusive with IAM credentials.
          example: br-api-key-1234567890abcdef
        region:
          type: string
          description: The AWS region for Bedrock. Required only for API key authentication.
          enum:
            - us-east-1
            - us-west-2
            - ap-northeast-1
            - ap-northeast-2
            - ap-northeast-3
            - ap-south-1
            - ap-south-2
            - ap-southeast-1
            - ap-southeast-2
            - ca-central-1
            - eu-central-1
            - eu-central-2
            - eu-north-1
            - eu-south-1
            - eu-south-2
            - eu-west-1
            - eu-west-2
            - eu-west-3
            - sa-east-1
    CreateBucketRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          description: |
            Name of the bucket. This field cannot be changed later. The name should adhere to the following rules:

            1. Characters used for the name should be in the ranges of A-Z, a-z, and 0-9; plus the underscore, period, dash, and percent characters.

            2. The name can be a maximum of 100 characters in length.

            3. The name cannot have 0 characters or empty. Minimum length of name is 1.

            4. The name cannot start with a `.` (period).
          maxLength: 100
          example: My-First-Bucket
        type:
          $ref: '#/components/schemas/Type'
        storageBackend:
          $ref: '#/components/schemas/StorageBackend'
        vbuckets:
          type: integer
          enum:
            - 128
            - 1024
          description: |
            This field only applies to Couchbase Server 8.0 and above for magma buckets.

            There are two options for the number of vBuckets: 128 and 1024. The number of vBuckets cannot be changed after the bucket is created.
          example: 128
          default: 128
        memoryAllocationInMb:
          type: integer
          description: |
            The amount of memory to allocate for the bucket memory in MiB. This is the maximum limit is dependent on the allocation of the KV service. For example, 80% of the allocation.

            - For Couchbase buckets, the default and minimum memory allocation changes according to the Storage Backend type as follows:

              1. For Couchstore, the default and minimum memory allocation is 100 MiB.

              2. For Magma, the default and minimum memory allocation is 1024 MiB with 1024 buckets for Couchbase server below 8.0. 
                 The default and minimum memory allocation is 100 MiB with 128 vbuckets for Couchbase server version 8.0 and above.

            - For Ephemeral buckets, the default and minimum memory allocation is 100 MiB.
          example: 100
        bucketConflictResolution:
          $ref: '#/components/schemas/BucketConflictResolution'
        durabilityLevel:
          $ref: '#/components/schemas/DurabilityLevel'
        replicas:
          $ref: '#/components/schemas/Replicas'
        flush:
          type: boolean
          description: |
            Replaced by flushEnabled. This property is deprecated and will be removed in a future release.

            Determines whether flushing is enabled on the bucket. Enable Flush to delete all items in this bucket at the earliest opportunity. Disable Flush to avoid inadvertent data loss.
          default: false
          example: false
          deprecated: true
        flushEnabled:
          type: boolean
          description: Determines whether bucket flush is enabled. Set flushEnabled to true to be able to delete all items in this bucket using the /flush endpoint. Disable flushEnabled to avoid inadvertent data loss by calling the /flush endpoint .
          default: false
          example: false
        timeToLiveInSeconds:
          type: integer
          description: Specify the time to live (TTL) value in seconds. This is the maximum time to live for items in the bucket. Default is 0, that means TTL is disabled. This is a non-negative value.
          default: 0
          example: 0
        evictionPolicy:
          $ref: '#/components/schemas/EvictionPolicy'
        priority:
          $ref: '#/components/schemas/BucketPriority'
