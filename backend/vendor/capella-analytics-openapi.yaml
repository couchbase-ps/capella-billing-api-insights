          description: The AWS account ID.
        azure-capella-subscription:
          type: string
          example: MyApp-Prod-Project
          description: The Azure subscription name.
    CloudConfig:
      type: object
      required:
        - provider
        - region
        - compute
      description: The cloud configuration for the model.
      properties:
        provider:
          type: string
          description: The cloud service provider where the model will be deployed. Currently only AWS is supported.
          enum:
            - aws
            - gcp
            - azure
          example: aws
        region:
          type: string
          description: Cloud provider region, for example `us-west-2`.
          example: us-east-1
        compute:
          type: object
          required:
            - cpu
            - gpuMemory
          description: Type of the compute on which the model is deployed.
          properties:
            cpu:
              type: integer
              format: int32
              description: The number of cpu vCPUs. For AWS instances g6.xlarge, g6e.xlarge use 4 vCPUs, and for p3.8xlarge use 32 vCPUs.
              enum:
                - 4
                - 32
              example: 4
            gpuMemory:
              type: integer
              description: The memory in GB for the GPU. For AWS instance g6.xlarge use 24 GB GPU Memory, for g6e.xlarge use 48 GB GPU Memory, and for g6e.12xlarge use 192 GB RAM.
              enum:
                - 24
                - 48
                - 192
              example: 48
