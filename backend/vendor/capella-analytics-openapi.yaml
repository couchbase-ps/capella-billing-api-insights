openapi: 3.0.2
info:
  title: Couchbase Capella Analytics Management API
  version: '4.0'
  description: |
    The Couchbase Capella Analytics Management API provides a set of endpoints for creating and managing Capella Analytics clusters.
    Users are able to perform operations such as creating Capella Analytics clusters and managing their configurations.
    This API documentation specifies the endpoints, request and response formats, and authentication requirements
    for seamless integration with Couchbase Capella.

    To access the Management API, you need an API key.
    To create an initial bootstrap API key you must use the Capella UI.
    Once you have created an initial bootstrap API key, you can use the Management API to create further API keys.
    To learn more, see [Get Started with the Capella Analytics Management API](https://docs.couchbase.com/analytics/management-api-guide/management-api-start.html).

    For a history of updates to the Management API, see [Capella Analytics Management API Change Log](https://docs.couchbase.com/analytics/management-api-guide/management-api-log.html).

    **API Base URL:**

    `https://cloudapi.cloud.couchbase.com`

    [Back to Capella Analytics Management API Documentation](https://docs.couchbase.com/analytics/management-api-guide/management-api-intro.html)
servers:
  - url: https://cloudapi.cloud.couchbase.com
security:
  - token: []
tags:
  - name: Allowed CIDRs (Analytics Cluster)
    description: |
      Columnar analytics clusters only allow connections from trusted IP addresses.
      Each analytics cluster has a configurable Allowed IP list that can include up to 75 entries.
      Each entry can be a single IP address or an IP address space.
      Any IP address you add to this list can have a user-specified expiration time for temporary access, or be permanent.
      Capella automatically denies any connection attempts to and from an IP not in the allowed IP list.
  - name: Api Keys
    description: Couchbase Capella Management API uses a Bearer token mechanism for authentication; each call to the Management API has to be authenticated by API key.
  - name: Columnar Analytics Cloud Snapshot Backups & Restore
    description: |
      Couchbase provides a comprehensive backup solution, supporting both scheduled and on-demand backups to ensure robust
      disaster recovery for production data. In Couchbase Capella, you can perform scheduled and on-demand backups of
      columnar cloud snapshot data. On-demand backups are always full backups and start immediately upon request,
      ensuring you can capture the current state of your data whenever needed.
  - name: Columnar Analytics Cloud Snapshot Backups Schedule
    description: |
      Couchbase provides automatic backup scheduling as part of its disaster recovery strategy at the cluster level.
      In Couchbase Capella, once a backup schedule is set, the system automatically backs up the entire cluster based on
      the defined schedule, ensuring that all data within the cluster is protected according to your retention policies.
  - name: Columnar Analytics Clusters
    description: |
      The Columnar Analytics Clusters endpoint allows users to manage their Capella Columnar analytics clusters.
      Capella Columnar is an analytical database (RT-OLAP) for bringing data together for real time apps and operational intelligence.
      Using this endpoint, users can create new clusters, get details of a specific cluster or a listing of clusters, scale up or down existing clusters, and delete clusters.
  - name: Columnar Analytics On/Off Schedule
    description: |
      The Columnar Analytics On/Off Schedule endpoint enables you to schedule when your Columnar analytics cluster should turn on or off to save costs.
      Turning off the cluster only turns off the compute;
      all of your data, indexes, and cluster configuration remain, including users and allow lists.
      When you turn your Columnar analytics cluster off, you will be charged the OFF amount for the cluster.
  - name: Columnar Analytics Private Endpoint Service
    description: |
      Access your Analytics cluster from your cloud provider's private network.
      Supporting infrastructure is deployed and it may take a few minutes for private endpoints to be available. 
      After it's enabled, you can create private endpoint in your network. You can do this using the cloud provider's CLI. 
      For an example, use the POST privateEndpointService/endpointCommand endpoint to get the command.
  - name: Organizations
    description: |
      Couchbase Capella uses an ordered hierarchy to help you keep all of your data organized and securely accessible.
      The entity at the top of the hierarchy is called an organization.
      Everything you do in Capella, whether it's creating a cluster or managing billing, happens within the scope of an organization.
  - name: Projects
    description: |
      Projects contain and allow access to Couchbase databases.
      Projects are used to organize and manage groups of Couchbase databases within organizations.
      An organization can contain any number of projects, and a project can contain any number of databases.
  - name: Users
    description: |
      To access an organization, your Couchbase Capella user account must be added to it.
      Accounts are added to an organization using email invitations sent from Capella by a user with the Organization Owner organization role.
      All organization users are given one or more organization roles that define what they can view and manage in their organization.
paths:
  /v4/organizations/{organizationId}/cloudAccounts:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
  /v4/organizations/{organizationId}/apikeys:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
    post:
      summary: Create API Key
      description: |
        Creates a new API key under an organization.

        Organization Owners can create Organization and Project scoped API keys.

        Project Owner and Project Creator can create project scoped keys.

        To learn more, see [Organization, Project, and Database Access Overview](https://docs.couchbase.com/cloud/organizations/organization-projects-overview.html).
      tags:
        - Api Keys
      operationId: postOrganizationAPIKeys
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAPIKeyRequest'
            examples:
              createOrganizationOwnerAPIKey:
                value:
                  name: Organization Owner API Key
                  description: Creates an API key with a Organization Owner role.
                  expiry: 720
                  allowedCIDRs:
                    - 8.8.8.8/32
                  organizationRoles:
                    - organizationOwner
                  resources: []
              createProjectOwnerAPIKey:
                value:
                  name: Project Owner API Key
                  description: Creates an API key with a Project Owner role.
                  expiry: 720
                  allowedCIDRs:
                    - 8.8.8.8/32
                  organizationRoles:
                    - organizationMember
                  resources:
                    - id: ffffffff-aaaa-1414-eeee-000000000000
                      roles:
                        - projectOwner
      responses:
        '201':
          description: Successfully created an API key under an organization.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateAPIKeyResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/AccessForbidden'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '500':
          $ref: '#/components/responses/InternalServerError'
    get:
      summary: List API keys
      description: |
        Lists all the API keys under an organization.

        Organization Owners can list all the API keys inside the Organization.

        Organization Members and Project Creators can list all the Project scoped API key for which they are Project Owner.

        To learn more, see [Organization, Project, and Database Access Overview](https://docs.couchbase.com/cloud/organizations/organization-projects-overview.html).
      tags:
        - Api Keys
      operationId: listOrganizationAPIKeys
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/APIKeysSortBy'
        - $ref: '#/components/parameters/SortDirection'
      responses:
        '200':
          description: Successfully listed all the apikeys under an organization.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAPIKeys'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/AccessForbidden'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /v4/organizations/{organizationId}/apikeys/{ApiKeyId}:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/AccessKey'
    get:
      summary: Get API Key
      description: |
        Fetches the details of the given API key under an organization.

        Organization Owners can get any API key inside the Organization.

        Organization Members and Project Creator can get any Project scoped API key for which they are Project Owner.

        To learn more, see [Organization, Project, and Database Access Overview](https://docs.couchbase.com/cloud/organizations/organization-projects-overview.html).
      tags:
        - Api Keys
      operationId: getOrganizationAPIKeyByAccessKey
      responses:
        '200':
          description: Successfully fetched the API key by its Access key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAPIKey'
              examples:
                createOrganizationOwnerAPIKey:
                  value:
                    id: IS9DrRsw4KWFS72Zhbj4xmhllHvPcdCL
                    name: Organization Owner API Key
                    description: Creates an API key with an Organization Owner role.
                    expiry: 720
                    allowedCIDRs:
                      - 8.8.8.8/32
                    organizationRoles:
                      - organizationOwner
                    resources: []
                    audit:
                      createdBy: ffffffff-aaaa-1414-eeee-000000000000
                      createdAt: '2021-09-01T12:34:56Z'
                      modifiedBy: ''
                      modifiedAt: '2021-09-01T12:34:56Z'
                      version: 1
        '403':
          $ref: '#/components/responses/AccessForbidden'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      summary: Delete API Key
      description: |
        Deletes the given API key under an organization.

        Organization Owners can delete any API key inside the Organization.

        Organization Members and Project Creator can delete any Project scoped API key for which they are Project Owner.

        To learn more, see [Organization, Project, and Database Access Overview](https://docs.couchbase.com/cloud/organizations/organization-projects-overview.html).
      tags:
        - Api Keys
      operationId: deleteOrganizationAPIKey
      responses:
        '204':
          description: Successfully deleted the API key by its Access key.
        '403':
          $ref: '#/components/responses/AccessForbidden'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /v4/organizations/{organizationId}/apikeys/{ApiKeyId}/rotate:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/AccessKey'
    post:
      summary: Rotate API Key
      description: |
        Rotate the secret of a given API key under an organization.

        Organization Owners can rotate any API key inside the Organization.

        To learn more, see [Organization, Project, and Database Access Overview](https://docs.couchbase.com/cloud/organizations/organization-projects-overview.html).
      tags:
        - Api Keys
      operationId: postOrganizationAPIKeyRotate
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RotateAPIKeyRequest'
            examples:
              rotateOrganizationOwnerAPIKey:
                value:
                  secret: <YOUR_SECRET_KEY_HERE>
      responses:
        '200':
          description: Successfully rotated the API key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RotateAPIKeyResponse'
              examples:
                rotateOrganizationOwnerAPIKey:
                  value:
                    secretKey: <YOUR_SECRET_KEY_HERE>
                    token: <YOUR_TOKEN_HERE>
        '403':
          $ref: '#/components/responses/AccessForbidden'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /v4/organizations/{organizationId}/projects:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
    post:
      summary: Create Project
      description: |
        Creates a new project under the organization.

        In order to access this endpoint, the provided API key must have at least one of the following roles:
        - Organization Owner
        - Project Creator

        To learn more, see [Organization, Project, and Database Access Overview](https://docs.couchbase.com/cloud/organizations/organization-projects-overview.html).
      tags:
        - Projects
      operationId: postProject
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProjectRequest'
      responses:
        '201':
          description: Successfully created a project under the organization.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateProjectResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/AccessForbidden'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '500':
          $ref: '#/components/responses/InternalServerError'
    get:
      summary: List Project
      description: |
        Lists all the projects under the organization.

        In order to access this endpoint, the provided API key must have at least one of the following roles:
        - Organization Owner
        - Project Owner
        - Project Manager
        - Project Viewer
        - Database Data Reader/Writer
        - Database Data Reader

        To learn more, see [Organization, Project, and Database Access Overview](https://docs.couchbase.com/cloud/organizations/organization-projects-overview.html).
      tags:
        - Projects
      operationId: listProjects
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/ProjectsSortBy'
        - $ref: '#/components/parameters/SortDirection'
      responses:
        '200':
          description: Successfully listed all the projects under the organization.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetProjectsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/AccessForbidden'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /v4/organizations/{organizationId}/projects/{projectId}:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/ProjectId'
    get:
      summary: Get Project
      description: |
        Fetches the details of the given project.

        In order to access this endpoint, the provided API key must have at least one of the following roles:
        - Organization Owner
        - Project Owner
        - Project Manager
        - Project Viewer
        - Database Data Reader/Writer
        - Database Data Reader

        To learn more, see [Organization, Project, and Database Access Overview](https://docs.couchbase.com/cloud/organizations/organization-projects-overview.html).
      tags:
        - Projects
      operationId: getProjectByID
      responses:
        '200':
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          description: Successfully fetched the project based on the projectId.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetProjectResponse'
        '403':
          $ref: '#/components/responses/AccessForbidden'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      summary: Update Project
      description: |
        Update project name and or project description.

        In order to access this endpoint, the provided API key must have at least one of the following roles:
        - Organization Owner
        - Project Owner

        To learn more, see [Organization, Project, and Database Access Overview](https://docs.couchbase.com/cloud/organizations/organization-projects-overview.html).
      parameters:
        - $ref: '#/components/parameters/If-Match'
      tags:
        - Projects
      operationId: putProject
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProjectRequest'
      responses:
        '204':
          description: Successfully updated the project metadata.
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/AccessForbidden'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      summary: Delete Project
      description: |
        Deletes an existing project.

        In order to access this endpoint, the provided API key must have at least one of the following roles:
        - Organization Owner
        - Project Owner

        To learn more, see [Organization, Project, and Database Access Overview](https://docs.couchbase.com/cloud/organizations/organization-projects-overview.html).
      tags:
        - Projects
      operationId: deleteProjectByID
      responses:
        '204':
          description: Successfully deleted the project by its projectId.
        '403':
          $ref: '#/components/responses/AccessForbidden'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /v4/organizations/{organizationId}/projects/{projectId}/clusters/freeTier:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/ProjectId'
  /v4/organizations/{organizationId}/projects/{projectId}/clusters:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/ProjectId'
  /v4/organizations/{organizationId}/projects/{projectId}/clusters/freeTier/{clusterId}:
