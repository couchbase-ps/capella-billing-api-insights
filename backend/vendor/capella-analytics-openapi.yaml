      description: |
        Updates the retention period for a specific backup in your analytics cluster.

        The retention period determines how long a backup is stored before it is automatically deleted.
        Adjust this setting to extend or shorten the duration based on your retention policy.

        For further details on managing backups, refer to [Backup and Restore Data](https://docs.couchbase.com/columnar/admin/backup-restore.html).

        To access this endpoint, the provided API key must include one of the following roles.
        - Organization Owner
        - Project Owner
        - Project Manager

        For more information, visit [Organization, Project, and Database Access Overview](https://docs.couchbase.com/cloud/organizations/organization-projects-overview.html).
      tags:
        - Columnar Analytics Cloud Snapshot Backups & Restore
      operationId: updateColumnarAnalyticsBackupRetention
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EditColumnarAnalyticsBackupRetentionRequest'
      responses:
        '204':
          description: The backup retention time was successfully updated. No content is returned in the response.
        '403':
          $ref: '#/components/responses/AccessForbidden'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      summary: Delete Backup
      description: |
        Permanently deletes a specific backup from the analytics cluster.

        This action cannot be undone. Ensure that the backup is no longer needed before deletion,
        as it will remove all data associated with it.

        For further details on managing backups, refer to [Backup and Restore Data](https://docs.couchbase.com/columnar/admin/backup-restore.html).

        To access this endpoint, the provided API key must include one of the following roles.
        - Organization Owner
        - Project Owner
        - Project Manager

        For more information, visit [Organization, Project, and Database Access Overview](https://docs.couchbase.com/cloud/organizations/organization-projects-overview.html).
      tags:
