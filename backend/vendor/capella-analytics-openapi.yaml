      operationId: deleteColumnarAnalyticsBackup
      responses:
        '202':
          description: The backup deletion request was successfully received and is being processed.
        '403':
          $ref: '#/components/responses/AccessForbidden'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /v4/organizations/{organizationId}/projects/{projectId}/analyticsClusters/{analyticsClusterId}/cloudSnapshotBackupSchedule:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/AnalyticsClusterId'
    put:
      summary: Upsert Backup Schedule
      description: |
        Creates or updates the backup schedule for the specified Columnar Analytics Cluster.

        This operation allows you to configure or modify the timing and frequency of backups.
        It ensures that the cluster's backup process follows the defined schedule.

        For further details on managing backups, refer to [Backup and Restore Data](https://docs.couchbase.com/columnar/admin/backup-restore.html).

        To access this endpoint, the provided API key must include one of the following roles.
        - Organization Owner
        - Project Owner
        - Project Manager

        For more information on access roles, visit [Organization, Project, and Database Access Overview](https://docs.couchbase.com/cloud/organizations/organization-projects-overview.html).
      tags:
        - Columnar Analytics Cloud Snapshot Backups Schedule
      operationId: upsertColumnarAnalyticsBackupSchedule
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertColumnarAnalyticsBackupScheduleRequest'
      responses:
        '204':
          description: The backup schedule was successfully created or updated. No content will be returned in the response.
        '403':
          $ref: '#/components/responses/AccessForbidden'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '500':
          $ref: '#/components/responses/InternalServerError'
    get:
      summary: Get Backup Schedule
      description: |
        Retrieves the current backup schedule for the specified Columnar Analytics Cluster.

        This operation provides the details of the backup schedule, including timing and frequency,
        so you can view and verify when backups are set to occur.

        For further details on managing backups, refer to [Backup and Restore Data](https://docs.couchbase.com/columnar/admin/backup-restore.html).

        To access this endpoint, the provided API key must include one of the following roles.
        - Organization Owner
        - Project Owner
        - Project Manager

        For more information on access roles, visit [Organization, Project, and Database Access Overview](https://docs.couchbase.com/cloud/organizations/organization-projects-overview.html).
      tags:
        - Columnar Analytics Cloud Snapshot Backups Schedule
      operationId: getColumnarAnalyticsBackupSchedule
      responses:
        '200':
          description: The backup schedule was successfully retrieved, and the response contains the details of the schedule in JSON format.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetColumnarAnalyticsBackupScheduleResponse'
        '204':
          description: The backup schedule was not found for the specified Columnar Analytics Cluster. No content will be returned in the response.
        '403':
          $ref: '#/components/responses/AccessForbidden'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      summary: Delete Backup Schedule
      description: |
        Deletes the existing backup schedule for the specified Columnar Analytics Cluster.

        This action permanently removes the scheduled backups, so no future backups will be
        initiated unless a new schedule is created.

        For further details on managing backups, refer to [Backup and Restore Data](https://docs.couchbase.com/columnar/admin/backup-restore.html).

        To access this endpoint, the provided API key must include one of the following roles.
        - Organization Owner
        - Project Owner
        - Project Manager

