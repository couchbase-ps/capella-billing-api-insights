    Compute:
      type: object
      description: |-
        Following are the supported compute combinations for CPU and RAM for different cloud providers.
        To learn more, see [Amazon Web Services](https://docs.couchbase.com/cloud/reference/aws.html).
      required:
        - cpu
        - ram
      properties:
        cpu:
          type: integer
          description: CPU units (cores).
          example: 4
        ram:
          type: integer
          description: RAM units (GB).
          example: 16
    Config:
      type: object
      description: Contains all the model information.
      properties:
        catalogModelName:
          type: string
          description: Name of the model deployed from the model catalog.
          example: meta-llama/Llama-3.1-8B-Instruct
        type:
          type: string
          description: The kind of model.
          enum:
            - text-generation
            - embedding-generation
            - moderation
            - prompt-injection
        provider:
          type: string
          description: The provider of the model.
          enum:
            - meta
            - nvidia
          example: meta
        quantization:
          type: string
          description: Quantization options for the model. Options include 8-bit, 16bit, and full-precision.
          enum:
            - fp8
            - fp16
            - fullPrecision
          example: fullPrecision
        optimization:
          type: string
          description: Optimization profile option for the model.
          enum:
            - throughput
            - latency
          example: latency
        dimensions:
          type: integer
          description: Dimensions specifies the number of dimensions for the embedding vectors. This field is only present     and relevant when the underlying model is an embedding model.
          example: 4096
        caching:
          $ref: '#/components/schemas/Caching'
        enableBatching:
          type: boolean
          description: Enables batch processing to provide cost savings and improved efficiency for users making multiple similar large volume requests. When enabled, the system groups requests together and processes them in bulk, resulting in lower inference costs and better resource utilization. Note that batching is good for processing large volumes of requests asynchronously, but it can have delayed results (no streaming), lack of real-time feedback, limited debugging visibility, and a longer turnaround time, hence unsuitable for latency-sensitive use cases. Users can check the status of their batches or cancel an ongoing batch using the AI gateway APIs for batching.
          example: true
        keywordFiltering:
          type: array
          description: Keywords in a comma-separated string to filter the input.
          items:
            type: string
          example:
            - harassment
            - murder
    ConfigurationType:
      deprecated: true
      type: string
      description: |
        - Multi-node databases are best for deployments that require high availability. If your app requires high performance and high availability, choose the Multi-node option.
        - Single-node databases have resource limitations that make them a good choice for learning, prototyping, and non-production uses. They have limited availability.
        - Single-node databases should contain only 1 node and 1 Service Group. Adding number of nodes or service groups > 1 is not allowed for such databases.
        - By default the configurationType is multiNode.
      enum:
        - singleNode
        - multiNode
      default: multiNode
      example: multiNode
    ConsoleLoggingConfig:
