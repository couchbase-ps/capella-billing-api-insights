    filter:
      type: object
      description: Filter contains the replication settings which are passed to the Couchbase server API while creating a replication.
      properties:
        documentExcludeOptions:
          type: object
          properties:
            deletion:
              type: boolean
              default: false
              description: When true, deletions are filtered out.
            expiration:
              type: boolean
              default: false
              description: When true, expirations are filtered out.
            ttl:
              type: boolean
              default: false
              description: When true, TTL value is removed from the replicated documents.
            binary:
              type: boolean
              default: false
              description: When true, binary documents are filtered.
        expressions:
          type: object
          properties:
            regEx:
              type: string
              description: Filter expression to match documents.
              example: REGEXP_CONTAINS(country, "France")
            skipRestream:
              type: boolean
              default: false
              description: |
                If true, updated filter applies only to new mutations.
                If false, replication restarts with updated filter.
