        - destroying
        - destroyFailed
        - healthy
        - degraded
        - scaling
        - scaleFailed
        - upgrading
        - upgradeFailed
        - turnedOff
        - turningOff
        - turnOffFailed
        - turningOn
        - turnOnFailed
