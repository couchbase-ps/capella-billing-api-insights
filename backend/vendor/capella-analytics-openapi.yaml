        name:
          type: string
          description: The user name.
          example: dfelton
    AuditSettingsDisabledUsers:
      type: array
      description: List of users whose filterable events will not be logged.
      items:
        $ref: '#/components/schemas/AuditSettingsDisabledUser'
    Availability:
      type: object
      required:
        - type
      properties:
        type:
